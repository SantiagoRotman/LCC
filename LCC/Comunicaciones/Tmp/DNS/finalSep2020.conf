;/etc/named.conf de ns.cargill.com

zone "cargill.com" {
    type master;
    file "etc/bind/db.cargill";
    allow-query{any};
    allow-transfer {slaves};
}

zone "229.3.in-addr.arpa" {
    type master;
    file "etc/bind/rev.cargill";
}

zone "cargillargentina.com.ar" {
    type slave;
    masters {179.190.44.30};
    file "etc/bind/db.cargillargentina"
}

; db.cargill ns.cargill.com

$TTL 1d
$ORIGIN cargill.com

@ IN SOA ns hostname (20111801;2h;2d;2w;2h
    )
    IN NS ns
    IN MX 10 info

www                     IN A 3.229.231.147
info                    IN A 3.229.231.146
dns.matl                IN A 3.229.231.191
comodity.trade          IN A 3.229.231.143
consult.trade           IN A 3.229.231.140

ns IN CNAME www 

matl IN NS dns.matl
trade IN MX 20 consult.trade